name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build check (syntax and import compile)
        run: python -m compileall -q app.py

      - name: Run tests
        run: pytest -v

  docker-publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy-smoke-test:
    needs: docker-publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image that was just published
        run: docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Run the container
        run: |
          docker run -d --name flask-app -p 5000:5000 \
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Wait for the app and check /health
        run: |
          for i in $(seq 1 10); do
            if curl -fs http://localhost:5000/health; then
              echo ""
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 2 seconds..."
            sleep 2
          done
          echo "Health check FAILED"
          exit 1

      - name: Test the add endpoint
        run: |
          RESULT=$(curl -fs http://localhost:5000/add/4/6)
          echo "$RESULT"
          echo "$RESULT" | grep -Eq '"result": *10'

      - name: Show container logs
        if: always()
        run: docker logs flask-app

      - name: Stop container
        if: always()
        run: docker rm -f flask-app